name: Astronomy Website Pipeline
# Events that automatically start the pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

# Permissions granted to the workflow
permissions:
  contents: read

jobs:
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: Front-end/astronomy-app
        run: npm ci

      - name: Run ESLint
        working-directory: Front-end/astronomy-app
        run: npm run lint

  frontend-format:
    name: Frontend Format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: Front-end/astronomy-app
        run: npm ci

      - name: Check formatting
        working-directory: Front-end/astronomy-app
        run: npm run format:check

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
          cache: maven

      - name: Run checkstyle
        working-directory: Backend
        run: ./mvnw checkstyle check

  backend-format:
    name: Backend format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
          cache: maven

      - name: Check formatting
        working-directory: Backend
        run: ./mvnw spotless:check
